[project]
name = "claw-agent"
version = "0.1.0"
description = "Web 采集子 Agent：自然语言 → Piper 模版 → Runtime 执行（gRPC Worker）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "protobuf>=4.25",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "ruff>=0.3"]
llm = ["openai>=1.12", "anthropic>=0.18"]

[project.scripts]
claw-agent = "claw_agent.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
