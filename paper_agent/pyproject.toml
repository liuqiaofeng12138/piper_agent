[project]
name = "paper-agent"
version = "0.1.0"
description = "学术论文搜索子 Agent：联网检索 arXiv + LangGraph + LLM 汇总"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
    "pyyaml>=6.0",
    "langgraph>=0.2.0",
    "openai>=1.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
