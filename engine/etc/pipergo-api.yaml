Name: piper_go-api
Host: 0.0.0.0
# Java Spark 默认 81；本地开发可改为 8888
Port: 8888

WebAPI:
  noAuth: true
  notification: false
  onlyVideo: false
  prometheusHost: http://127.0.0.1:9090
  # 与 docker/prometheus/prometheus.yml 中 piper job 的 instance 标签一致
  prometheusScrapeInstance: 127.0.0.1:8888
  grafanaHost: http://127.0.0.1:3000
  provisionGrafanaDashboard: true
  # 与 docker/piper_dev.yaml 中 GF_SECURITY_ADMIN_* 一致；用于首次导入 piper 仪表盘
  grafanaAdminUser: admin
  grafanaAdminPassword: jK0+pE1!
  # 启动前校验 docker/piper_dev.yaml 中的容器与 ES/S3/Prometheus 端点；未就绪则进程退出
  requireDeps: true
  requiredContainers:
    - elasticsearch
    - minio
    - prometheus
  depsMaxWaitSeconds: 120
  skipStorageWait: false
  storageWaitEveryMs: 5000

ES:
  host: 127.0.0.1
  port: 9200
  # 与 docker/piper_dev.yaml 中 ELASTIC_PASSWORD 一致（xpack.security.enabled）
  username: elastic
  password: mG0pL3aL

S3:
  endpointUrl: http://127.0.0.1:9000
  accessKey: admin
  secretKey: jQ2@xF0@

H2:
  path: ./db/raw_meta.db

Auth:
  tokenTtlSeconds: 86400
  serviceToken: piper-internal-service-token
  users:
    - username: demo
      password: demo
      email: demo@local
      roles:
        - admin
        - user

Requester:
  connectTimeout: 80000
  readTimeout: 120000
  tokenTimeout: 120000
  requestPerSecondLimit: 20
  pageLoadTimeout: 180000

Chrome:
  enabled: true
  headless: false
  agentCount: 1
