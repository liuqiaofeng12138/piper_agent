syntax = "proto3";

package common.v1;

option go_package = "piper_agent/runtime/pkg/pb/common/v1;commonv1";

// ErrorCode is returned in gRPC status details (Phase A: documented; Phase B+: enforced).
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_FAILED_PRECONDITION = 3;
  ERROR_CODE_ALREADY_EXISTS = 4;
  ERROR_CODE_INTERNAL = 5;
  ERROR_CODE_UNAVAILABLE = 6;
  ERROR_CODE_DEADLINE_EXCEEDED = 7;
  ERROR_CODE_CANCELLED = 8;
}
