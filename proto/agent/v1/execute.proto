syntax = "proto3";

package agent.v1;

option go_package = "piper_agent/gateway/pkg/pb/agent/v1;agentv1";

// Web 网关调用的 Python 子 Agent Worker（与 runtime.v1 采集 RPC 分离）。
service AgentWorkerService {
  rpc Execute(ExecuteRequest) returns (stream ExecuteEvent);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

message ExecuteRequest {
  string trace_id = 1;
  string conversation_id = 2;
  string run_id = 3;
  string agent_id = 4;
  string user_message = 5;
}

message ExecuteEvent {
  string type = 1;
  string delta = 2;
  string content = 3;
  string tool_name = 4;
  string tool_detail = 5;
  string message = 6;
}

message CancelRequest {
  string run_id = 1;
}

message CancelResponse {
  bool ok = 1;
  string message = 2;
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
  string agent_id = 2;
}
