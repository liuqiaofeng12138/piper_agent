[project]
name = "piper-agent"
version = "0.1.0"
description = "平台通用子 Agent Workers（general_chat 等非采集类 Agent）"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
